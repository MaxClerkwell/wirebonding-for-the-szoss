name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile slides
        uses: xu-cheng/latex-action@v3
        with:
          root_file: slides.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      - name: Name the PDF
        run: cp build/slides.pdf "wirebonding-szoss-${GITHUB_REF_NAME//\//-}.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: wirebonding-szoss-*.pdf

  release:
    # Only for version tags, e.g. `git tag v0.1.0 && git push origin v0.1.0`
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slides

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wirebonding-szoss-*.pdf
          generate_release_notes: true
